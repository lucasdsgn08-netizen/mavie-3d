<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Mavie — 3D</title>
  <meta name="description" content="Protótipo interativo 3D da embalagem Mavie.">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="viewer">
    <div class="brand">mavie<sup>™</sup></div>

    <model-viewer id="can"
      src="MVE - LATINHA 3D.glb"
      poster="poster.webp"
      alt="Embalagem Mavie em 3D"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      auto-rotate-delay="1200"
      rotation-per-second="10deg"
      interaction-prompt="none"
      shadow-intensity="0.7"
      shadow-softness="0.9"
      exposure="1"
      tone-mapping="neutral"
      ar
      ar-modes="webxr scene-viewer quick-look">

      <div class="progress-bar hide" slot="progress-bar"><div class="update-bar"></div></div>

      <button slot="ar-button" id="ar-button" type="button">Ver no seu espaço</button>

      <div id="ar-prompt" aria-hidden="true">
        <img src="ar_hand_prompt.png" alt="">
      </div>
    </model-viewer>

    <div class="hint">
      <span class="gesture">↔</span>
      <span>Arraste para explorar</span>
      <span class="dot">·</span>
      <span>Pinça para ampliar</span>
    </div>
  </main>

  <script src="./script.js"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
</body>
</html>
