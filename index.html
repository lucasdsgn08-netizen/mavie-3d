<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Mavie — 3D</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#111}
    .stage{position:relative;width:100%;height:100dvh;min-height:520px;background:#fff}
    model-viewer{display:block;width:100%;height:100%;background:#fff;--poster-color:#fff}
    .brand{position:absolute;z-index:5;top:max(28px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);pointer-events:none}
    .brand img{display:block;width:92px;height:auto}
    .hint{position:absolute;z-index:5;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 13px;border:1px solid rgba(0,0,0,.07);border-radius:999px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:rgba(0,0,0,.45);font-size:11px;white-space:nowrap;pointer-events:none}
    #ar-button{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);min-height:44px;padding:0 18px;border:1px solid rgba(0,0,0,.1);border-radius:999px;background:rgba(255,255,255,.94);color:#111;font:500 13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.05)}
    .progress-bar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(160px,38vw);height:2px;border-radius:999px;overflow:hidden;background:rgba(0,0,0,.07)}
    .progress-bar.hide{visibility:hidden}.update-bar{width:0;height:100%;background:#111}
    #ar-prompt{position:absolute;left:50%;bottom:125px;display:none}
    model-viewer[ar-status="session-started"]>#ar-prompt{display:block}
    #ar-prompt img{width:44px}
    @media(max-width:520px){.brand{top:max(24px,env(safe-area-inset-top))}.brand img{width:82px}.hint{bottom:max(18px,env(safe-area-inset-bottom));font-size:10px}#ar-button{bottom:64px}}
  </style>
</head>
<body>
  <main class="stage">
    <div class="brand"><img src="mavielogo.svg" alt="Mavie"></div>

    <model-viewer
      src="MVE - LATINHA 3D.glb"
      poster="poster.webp"
      alt="Embalagem Mavie em 3D"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      touch-action="pan-y"
      camera-target="auto auto auto"
      camera-orbit="0deg 75deg 200%"
      min-camera-orbit="auto auto 75%"
      max-camera-orbit="auto auto 300%"
      field-of-view="30deg"
      tone-mapping="neutral"
      shadow-intensity="1"
      auto-rotate
      auto-rotate-delay="1000"
      rotation-per-second="8deg"
      interaction-prompt="none">

      <div class="progress-bar hide" slot="progress-bar"><div class="update-bar"></div></div>
      <button slot="ar-button" id="ar-button">Ver no seu espaço</button>
      <div id="ar-prompt"><img src="ar_hand_prompt.png" alt=""></div>
    </model-viewer>

    <div class="hint">↔ &nbsp;Arraste para explorar · Pinça para ampliar</div>
  </main>

  <script>
    const viewer=document.querySelector('model-viewer');
    const onProgress=(event)=>{
      const bar=event.target.querySelector('.progress-bar');
      const update=event.target.querySelector('.update-bar');
      update.style.width=`${event.detail.totalProgress*100}%`;
      if(event.detail.totalProgress===1){bar.classList.add('hide');event.target.removeEventListener('progress',onProgress)}
      else{bar.classList.remove('hide')}
    };
    viewer.addEventListener('progress',onProgress);
  </script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
</body>
</html>
